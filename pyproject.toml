[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diskrescue"
version = "0.3.1"
description = "Sistema unificado e autônomo para diagnóstico profundo, clonagem resiliente e recuperação forense de discos."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kaio Lima" }
]
license = { text = "MIT" }
keywords = ["disk-recovery", "forensics", "data-recovery", "ddrescue", "smart", "ntfs", "mbr", "gpt", "carver", "surface-scan"]
dependencies = [
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "cli*"]

[project.optional-dependencies]
gui = [
    "sv-ttk>=2.6.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
    "sv-ttk>=2.6.0",
    "pillow>=10.0.0",
]

[project.scripts]
diskrescue = "cli.main:main"
