name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gui,dev]"

    - name: Run Test Suite with Pytest
      run: |
        pytest tests/ -v

    - name: Build Portable Executable with PyInstaller
      if: matrix.python-version == '3.12'
      run: |
        pyinstaller DiskRescue.spec --clean --noconfirm

    - name: Verify Executable and Calculate SHA-256
      if: matrix.python-version == '3.12'
      shell: powershell
      run: |
        if (!(Test-Path "dist\DiskRescue.exe")) {
          Write-Error "dist\DiskRescue.exe não foi gerado pelo PyInstaller!"
          exit 1
        }
        $hash = (Get-FileHash "dist\DiskRescue.exe" -Algorithm SHA256).Hash
        Write-Output "DiskRescue.exe SHA-256: $hash"

    - name: Run Smoke Test on Executable
      if: matrix.python-version == '3.12'
      run: |
        .\dist\DiskRescue.exe --smoke-test

    - name: Upload Portable Executable Artifact
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: DiskRescue-Portable-v0.3.1
        path: dist\DiskRescue.exe
        if-no-files-found: error
